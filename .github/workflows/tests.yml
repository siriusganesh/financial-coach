name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Section 12 self-test
        run: python -I -m unittest discover -s tests -v

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Schema runs twice, then RLS checks
        run: |
          psql -v ON_ERROR_STOP=1 -q \
            -f tests/rls/00_supabase_stub.sql \
            -f supabase/schema.sql \
            -f supabase/schema.sql \
            -f tests/rls/10_rls_test.sql
